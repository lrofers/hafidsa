<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Hafidh Sabryan Alfatih Portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05070c; --panel:#0b1626; --panel2:#0e1e33;
    --line:rgba(255,255,255,0.09);
    --cyan:#4fb3e8; --text:#eef3f8; --muted:#8ea3b8; --danger:#c23b3b;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg-deep);color:var(--text);
    font-family:'Inter',sans-serif;min-height:100vh;
  }
  .hud{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;}
  .display{font-family:'Anton',sans-serif;}

  /* login screen */
  #login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(ellipse 900px 500px at 50% 40%, rgba(26,66,112,.4), transparent 60%);
  }
  .login-box{
    width:340px;padding:36px;background:var(--panel);
    border:1px solid var(--line);border-radius:12px;
  }
  .login-box h1{font-size:24px;margin:0 0 6px;}
  .login-box p{color:var(--muted);font-size:13px;margin:0 0 24px;}
  label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px;}
  input, textarea{
    width:100%;padding:11px 12px;background:#081221;border:1px solid var(--line);
    border-radius:7px;color:var(--text);font-size:14px;margin-bottom:16px;font-family:inherit;
  }
  input:focus, textarea:focus{outline:none;border-color:var(--cyan);}
  button{
    cursor:pointer;border:none;border-radius:7px;padding:12px 18px;
    font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:1px;
    background:linear-gradient(135deg,var(--cyan),#2a6fa8);color:#04121e;font-size:14px;
    width:100%;
  }
  button.secondary{background:transparent;border:1px solid var(--line);color:var(--muted);}
  button.danger{background:linear-gradient(135deg,var(--accent-red-1,#c23b3b),#6e1420);color:#fff;}
  .msg{font-size:13px;margin-top:12px;min-height:16px;}
  .msg.error{color:#e88;}
  .msg.ok{color:#8ec9a1;}

  /* dashboard */
  #dashboard{display:none;max-width:920px;margin:0 auto;padding:40px 24px 100px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:36px;}
  .topbar h1{font-size:20px;}
  .topbar button{width:auto;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:24px;margin-bottom:20px;
  }
  .card h2{font-size:15px;margin:0 0 4px;}
  .card .hint{color:var(--muted);font-size:12px;margin-bottom:18px;}
  .row{display:flex;gap:16px;}
  .row > div{flex:1;}
  .photo-preview{
    width:110px;height:110px;border-radius:50%;object-fit:cover;
    border:2px solid var(--line);margin-bottom:14px;display:block;
  }
  .repeater-item{
    border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:12px;position:relative;
  }
  .repeater-item .remove{
    position:absolute;top:10px;right:10px;background:none;border:none;color:var(--muted);
    width:auto;padding:2px 8px;font-size:16px;
  }
  .add-btn{background:transparent;border:1px dashed var(--line);color:var(--cyan);margin-top:4px;}
  .skill-swatch{
    display:inline-flex;align-items:center;justify-content:center;
    width:40px;height:40px;border-radius:9px;font-family:'Rajdhani',sans-serif;font-weight:700;
    margin-bottom:8px;
  }
  .save-bar{
    position:sticky;bottom:0;background:rgba(5,7,12,0.9);backdrop-filter:blur(8px);
    padding:16px 0;border-top:1px solid var(--line);display:flex;gap:12px;justify-content:flex-end;
  }
  .save-bar button{width:auto;padding:12px 28px;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-box">
    <h1 class="display">Admin Panel</h1>
    <p>Hafidh Sabryan Alfatih — Portfolio 2025</p>
    <form id="login-form">
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Log In</button>
      <div class="msg error" id="login-msg"></div>
    </form>
  </div>
</div>

<!-- ===================== DASHBOARD ===================== -->
<div id="dashboard">
  <div class="topbar">
    <h1 class="display">Edit Portfolio</h1>
    <button class="secondary" id="logout-btn">Log Out</button>
  </div>

  <div class="card">
    <h2>Photo</h2>
    <div class="hint">Visitors see whatever photo is saved here.</div>
    <img id="photo-preview" class="photo-preview" src="" alt="preview">
    <input type="file" id="photo-input" accept="image/*">
  </div>

  <div class="card">
    <h2>Basic Info</h2>
    <label>Name</label>
    <input id="f-name">
    <label>Title / Role</label>
    <input id="f-title">
    <label>About</label>
    <textarea id="f-about" rows="5"></textarea>
  </div>

  <div class="card">
    <h2>Skills</h2>
    <div class="hint">Short 2-letter label + name, e.g. "Ps" / "Photoshop".</div>
    <div id="skills-repeater"></div>
    <button class="add-btn" id="add-skill">+ Add Skill</button>
  </div>

  <div class="card">
    <h2>Education</h2>
    <div id="education-repeater"></div>
    <button class="add-btn" id="add-education">+ Add Education</button>
  </div>

  <div class="card">
    <h2>Experience</h2>
    <div id="experience-repeater"></div>
    <button class="add-btn" id="add-experience">+ Add Experience</button>
  </div>

  <div class="save-bar">
    <div class="msg" id="save-msg" style="flex:1;"></div>
    <button id="save-btn" style="max-width:200px;">Save Changes</button>
  </div>
</div>

<script>
/* ============================================================
   CONFIG — point this at your own backend.
   See API_CONTRACT.md for exactly what each endpoint must do.
   This file never talks to JSONBin directly and never stores
   any API key — only your backend does that, server-side.
   ============================================================ */
const API_BASE = window.PORTFOLIO_API_BASE || "https://your-backend.example.com";

let state = null;
let newPhotoFile = null;

const tokenKey = 'portfolio_admin_token';
const getToken = () => sessionStorage.getItem(tokenKey);
const setToken = (t) => sessionStorage.setItem(tokenKey, t);
const clearToken = () => sessionStorage.removeItem(tokenKey);

function showDashboard(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
}
function showLogin(){
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('dashboard').style.display = 'none';
}

/* ---------- LOGIN ---------- */
document.getElementById('login-form').addEventListener('submit', async (e)=>{
  e.preventDefault();
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const msg = document.getElementById('login-msg');
  msg.textContent = '';
  try{
    const res = await fetch(`${API_BASE}/api/login`, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username, password})
    });
    if(!res.ok){
      const body = await res.json().catch(()=>({}));
      throw new Error(body.error || 'Login failed');
    }
    const { token } = await res.json();
    setToken(token);
    await loadPortfolio();
    showDashboard();
  }catch(err){
    msg.textContent = err.message || 'Login failed';
  }
});

document.getElementById('logout-btn').addEventListener('click', ()=>{
  clearToken();
  showLogin();
});

/* ---------- LOAD DATA ---------- */
async function loadPortfolio(){
  const res = await fetch(`${API_BASE}/api/portfolio`, {
    headers:{ Authorization: `Bearer ${getToken()}` }
  });
  if(res.status === 401){ clearToken(); showLogin(); throw new Error('Session expired'); }
  state = await res.json();
  state.skills = state.skills || [];
  state.education = state.education || [];
  state.experience = state.experience || [];
  populateForm();
}

function populateForm(){
  document.getElementById('photo-preview').src = state.photoUrl || '';
  document.getElementById('f-name').value = state.name || '';
  document.getElementById('f-title').value = state.title || '';
  document.getElementById('f-about').value = state.about || '';
  renderSkills();
  renderRepeater('education', state.education, ['period','title','sub']);
  renderRepeater('experience', state.experience, ['period','title','sub']);
}

function renderSkills(){
  const wrap = document.getElementById('skills-repeater');
  wrap.innerHTML = '';
  state.skills.forEach((s, i)=>{
    const div = document.createElement('div');
    div.className = 'repeater-item';
    div.innerHTML = `
      <button class="remove" data-idx="${i}" data-kind="skills">×</button>
      <div class="skill-swatch" style="background:${s.color||'#16324f'}">${s.label||'??'}</div>
      <div class="row">
        <div><label>Label (2 chars)</label><input data-field="label" data-idx="${i}" value="${s.label||''}" maxlength="3"></div>
        <div><label>Full Name</label><input data-field="name" data-idx="${i}" value="${s.name||''}"></div>
        <div><label>Badge Color</label><input data-field="color" data-idx="${i}" type="color" value="${s.color||'#16324f'}"></div>
      </div>`;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const idx = e.target.dataset.idx, field = e.target.dataset.field;
      state.skills[idx][field] = e.target.value;
      if(field==='label' || field==='color') renderSkills();
    });
  });
  wrap.querySelectorAll('.remove').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      state.skills.splice(e.target.dataset.idx,1);
      renderSkills();
    });
  });
}

function renderRepeater(kind, list, fields){
  const wrap = document.getElementById(`${kind}-repeater`);
  wrap.innerHTML = '';
  list.forEach((item, i)=>{
    const div = document.createElement('div');
    div.className = 'repeater-item';
    div.innerHTML = `
      <button class="remove" data-idx="${i}" data-kind="${kind}">×</button>
      <label>Period</label><input data-field="period" data-idx="${i}" data-kind="${kind}" value="${item.period||''}">
      <label>Title</label><input data-field="title" data-idx="${i}" data-kind="${kind}" value="${item.title||''}">
      <label>Detail</label><input data-field="sub" data-idx="${i}" data-kind="${kind}" value="${item.sub||''}">
    `;
    wrap.appendChild(div);
  });
  wrap.querySelectorAll('input').forEach(inp=>{
    inp.addEventListener('input', (e)=>{
      const idx=e.target.dataset.idx, field=e.target.dataset.field, k=e.target.dataset.kind;
      state[k][idx][field] = e.target.value;
    });
  });
  wrap.querySelectorAll('.remove').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const k = e.target.dataset.kind;
      state[k].splice(e.target.dataset.idx,1);
      renderRepeater(k, state[k], fields);
    });
  });
}

document.getElementById('add-skill').addEventListener('click', ()=>{
  state.skills.push({label:'', name:'', color:'#16324f'});
  renderSkills();
});
document.getElementById('add-education').addEventListener('click', ()=>{
  state.education.push({period:'', title:'', sub:''});
  renderRepeater('education', state.education);
});
document.getElementById('add-experience').addEventListener('click', ()=>{
  state.experience.push({period:'', title:'', sub:''});
  renderRepeater('experience', state.experience);
});

/* ---------- PHOTO ---------- */
document.getElementById('photo-input').addEventListener('change', (e)=>{
  const file = e.target.files[0];
  if(!file) return;
  newPhotoFile = file;
  document.getElementById('photo-preview').src = URL.createObjectURL(file);
});

/* ---------- SAVE ---------- */
document.getElementById('save-btn').addEventListener('click', async ()=>{
  const msg = document.getElementById('save-msg');
  msg.className = 'msg';
  msg.textContent = 'Saving…';

  state.name = document.getElementById('f-name').value;
  state.title = document.getElementById('f-title').value;
  state.about = document.getElementById('f-about').value;

  try{
    // 1) If a new photo was picked, upload it first and get back a URL.
    if(newPhotoFile){
      const fd = new FormData();
      fd.append('photo', newPhotoFile);
      const uploadRes = await fetch(`${API_BASE}/api/upload-photo`, {
        method:'POST',
        headers:{ Authorization: `Bearer ${getToken()}` },
        body: fd
      });
      if(!uploadRes.ok) throw new Error('Photo upload failed');
      const { photoUrl } = await uploadRes.json();
      state.photoUrl = photoUrl;
      newPhotoFile = null;
    }

    // 2) Save the rest of the portfolio data.
    const res = await fetch(`${API_BASE}/api/portfolio`, {
      method:'PUT',
      headers:{
        'Content-Type':'application/json',
        Authorization: `Bearer ${getToken()}`
      },
      body: JSON.stringify(state)
    });
    if(res.status === 401){ clearToken(); showLogin(); throw new Error('Session expired'); }
    if(!res.ok) throw new Error('Save failed');

    msg.className = 'msg ok';
    msg.textContent = 'Saved.';
  }catch(err){
    msg.className = 'msg error';
    msg.textContent = err.message || 'Something went wrong.';
  }
});

/* ---------- BOOT ---------- */
(async function boot(){
  if(getToken()){
    try{
      await loadPortfolio();
      showDashboard();
    }catch(err){
      showLogin();
    }
  }else{
    showLogin();
  }
})();
</script>
</body>
</html>
