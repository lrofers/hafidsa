    --paper:#f8f5ee; --paper-line:#e4ddc9;
    --blue:#2f6fee; --pink:#ff4fa3; --green:#22c55e; --purple:#8b5cf6; --orange:#f2a33e;
    --ink:#1e2430; --ink-muted:#5a6070;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background-color:#2c56e0;
    background-image: radial-gradient(rgba(255,255,255,.28) 1.6px, transparent 1.6px);
    background-size:24px 24px;
    animation:bgDrift 6s linear infinite;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    padding:36px 16px 60px;
    min-height:100vh;
  }
  .pixel{font-family:'Press Start 2P',monospace;line-height:1.5;}
  .script{font-family:'Caveat',cursive;font-weight:700;}

  /* ---------- OPENING HERO ---------- */
  #hero{
    min-height:100vh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:32px;text-align:center;
    padding:60px 16px;
  }
  .sticker{
    -webkit-text-stroke:0.09em #fff;
    paint-order:stroke fill;
    text-shadow:0 5px 0 rgba(0,0,0,.18);
  }
  .hero-blue-title h1{
    font-family:'Night House','Space Grotesk',sans-serif;font-weight:800;
    font-size:clamp(46px,13vw,120px);
    line-height:0.86;color:#0a2470;letter-spacing:1px;
    white-space:nowrap;
    animation:glowPulse 3.5s ease-in-out infinite;
  }
  .hero-blue-title h1 .letter{
    display:inline-block;
    opacity:0;
    animation:letterPop .7s cubic-bezier(.2,1.4,.4,1) forwards;
  }
  @keyframes letterPop{
    0%{opacity:0;transform:translateY(40px) rotate(8deg);}
    100%{opacity:1;transform:translateY(0) rotate(0deg);}
  }
  @keyframes floatY{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-8px);}
  }
  @keyframes wobble{
    0%,100%{transform:rotate(-0.6deg);}
    50%{transform:rotate(0.6deg);}
  }
  @keyframes swingPin{
    0%,100%{transform:translateX(-50%) rotate(-4deg);}
    50%{transform:translateX(-50%) rotate(4deg);}
  }
  @keyframes swingPinCorner{
    0%,100%{transform:rotate(-4deg);}
    50%{transform:rotate(4deg);}
  }
  @keyframes bgDrift{
    0%{background-position:0 0;}
    100%{background-position:48px 48px;}
  }
  @keyframes glowPulse{
    0%,100%{filter:drop-shadow(0 0 0 rgba(47,111,238,0));}
    50%{filter:drop-shadow(0 0 10px rgba(47,111,238,.35));}
  }
  .hero-tags{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;align-items:center;}
  .hero-tag{
    background:var(--paper, #f8f5ee);
    border:1px solid rgba(0,0,0,0.08);border-radius:14px;padding:10px 20px;
    font-size:11.5px;color:#2f3a4f;display:flex;align-items:center;gap:10px;
    font-family:'Space Mono',monospace;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    box-shadow:0 10px 20px rgba(0,0,0,.25);
    animation:floatY 3.4s ease-in-out infinite;
  }
  .hero-tags .hero-tag:nth-child(2){animation-delay:.6s;transform:rotate(1.5deg);}
  .hero-tags .hero-tag:nth-child(1){transform:rotate(-1.5deg);}
  .hero-tag .accent-dot{width:8px;height:8px;border-radius:50%;background:#ff7a45;flex-shrink:0;}
  .hero-role-sub{color:#5a6070;font-size:9.5px;margin-top:2px;font-weight:600;letter-spacing:1.5px;text-align:left;}
  .paper-nav{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
  .paper-nav a{
    background:var(--paper, #f8f5ee);
    color:#2f3a4f;text-decoration:none;
    font-family:'Space Mono',monospace;font-weight:700;font-size:11px;letter-spacing:1.5px;text-transform:uppercase;
    padding:12px 18px;border-radius:10px;
    box-shadow:0 10px 18px rgba(0,0,0,.22);
    border:1px solid rgba(0,0,0,.06);
    transition:transform .2s ease, box-shadow .2s ease;
  }
  .paper-nav a:nth-child(1){transform:rotate(-2deg);}
  .paper-nav a:nth-child(2){transform:rotate(1.5deg);}
  .paper-nav a:nth-child(3){transform:rotate(-1deg);}
  .paper-nav a:nth-child(4){transform:rotate(2deg);}
  .paper-nav a:hover{transform:translateY(-4px) rotate(0deg);box-shadow:0 14px 24px rgba(0,0,0,.3);}
  .paper-nav a.pressed{transform:scale(0.88) translateY(2px) rotate(0deg) !important;box-shadow:0 4px 8px rgba(0,0,0,.25) !important;transition:transform .15s ease, box-shadow .15s ease;}
  .reveal{opacity:0;transform:translateY(26px);transition:opacity .8s ease, transform .8s ease;}
  .reveal-left{opacity:0;transform:translateX(-60px);transition:opacity .8s ease, transform .8s ease;}
  .reveal-right{opacity:0;transform:translateX(60px);transition:opacity .8s ease, transform .8s ease;}
  .reveal-visible{opacity:1;transform:translateY(0) translateX(0);}

  .board-wrap{max-width:1180px;margin:0 auto;position:relative;}
  .board{
    background:
      repeating-linear-gradient(90deg, rgba(0,0,0,0.04) 0 2px, transparent 2px 34px),
      linear-gradient(180deg, var(--wood-light), var(--wood-mid) 55%, var(--wood-dark));
    border-radius:22px;
    padding:52px 44px;
    box-shadow:0 30px 60px rgba(0,0,0,.35);
  }
  .clip-pin{
    position:absolute;top:-26px;left:50%;
    width:54px;height:54px;border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #eee, #999 70%, #555);
    box-shadow:0 6px 10px rgba(0,0,0,.4);
    z-index:5;
    transform-origin:top center;
    animation:swingPin 4.5s ease-in-out infinite;
  }
  .clip-pin::after{
    content:"";position:absolute;top:46px;left:50%;transform:translateX(-50%);
    width:8px;height:36px;background:linear-gradient(#8a6a3a,#5c3f1e);border-radius:3px;
  }

  .row{display:grid;grid-template-columns:300px 1fr;gap:28px;margin-bottom:28px;}
  .row.bottom-row{grid-template-columns:1fr 1fr;align-items:stretch;}

  .paper-note{
    background:var(--paper);
    padding:30px 28px 34px;
    position:relative;
    box-shadow:0 14px 28px rgba(0,0,0,.28);
    border-radius:16px;
  }
  .paper-note.tilt{animation:wobble 5s ease-in-out infinite;transform-origin:center top;}

  /* ---------- ID CARD ---------- */
  .id-card{
    background:var(--paper);
    border-radius:14px;
    padding:20px 20px 26px;
    box-shadow:0 14px 28px rgba(0,0,0,.28);
    position:relative;
    transform:rotate(-1.2deg);
  }
  .id-clip{
    position:absolute;top:-16px;left:50%;transform:translateX(-50%);
    width:30px;height:22px;background:linear-gradient(#8a6a3a,#5c3f1e);border-radius:4px;
  }
  .id-photo-wrap{
    border:1px solid var(--paper-line);border-radius:6px;overflow:hidden;
    aspect-ratio:3/4;margin-bottom:14px;background:#e9e4d6;
  }
  .id-photo-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
  .id-tag{
    position:absolute;bottom:-18px;left:14px;
    background:#c9b8f0;color:#3a2a6e;
    font-size:11px;font-weight:700;
    padding:6px 12px;border-radius:8px;
    transform:rotate(-3deg);
    box-shadow:0 4px 8px rgba(0,0,0,.25);
    display:flex;align-items:center;gap:6px;
  }
  .contact-block{margin-top:26px;}
  .contact-title{color:var(--pink);font-size:13px;margin-bottom:12px;}
  .contact-row{
    display:flex;align-items:center;gap:10px;
    font-size:12.5px;color:var(--ink-muted);margin-bottom:9px;
  }
  .contact-row .ic{
    width:20px;height:20px;border-radius:5px;
    display:flex;align-items:center;justify-content:center;
    font-size:10px;flex-shrink:0;color:#fff;
  }
  .contact-row a{color:var(--pink);text-decoration:none;font-weight:600;}

  /* ---------- BIO NOTE ---------- */
  .bio-note .script-hi{color:var(--blue);font-size:26px;margin-bottom:-6px;}
  .bio-note h1{color:var(--blue);font-size:clamp(26px,4vw,38px);margin-bottom:18px;letter-spacing:-1px;}
  .bio-note .about-text{
    font-size:14px;line-height:1.85;color:var(--ink);max-width:56ch;margin-bottom:22px;
  }

  /* ---------- PROJECT NOTE ---------- */
  .project-note h2{color:var(--blue);font-size:20px;margin-bottom:6px;}
  .project-note .script-small{font-size:16px;color:var(--pink);margin-left:6px;}
  .project-collage{
    display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 16px;margin-top:18px;
    align-items:start;
  }
  .project-collage .thumb{
    width:100%;min-width:0;border-radius:6px;overflow:hidden;
    box-shadow:0 8px 16px rgba(0,0,0,.25);
    background:#fff;padding:6px 6px 20px;
  }
  .project-collage .thumb:nth-child(odd){transform:rotate(-3deg);}
  .project-collage .thumb:nth-child(even){transform:rotate(2.5deg);}
  .project-collage .thumb.gold{padding:8px 8px 22px;background:#f2c14e;}
  .project-collage img{width:100%;object-fit:cover;display:block;border-radius:2px;cursor:zoom-in;}
  .project-collage img[data-ratio="4-5"]{aspect-ratio:4/5;}
  .project-collage img[data-ratio="1-1"]{aspect-ratio:1/1;}
  .project-collage img[data-ratio="16-9"]{aspect-ratio:16/9;}
  .project-collage img[data-ratio="9-16"]{aspect-ratio:9/16;}
  .project-collage .cap{font-size:10px;color:var(--ink-muted);text-align:center;margin-top:6px;}

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    display:none;position:fixed;inset:0;z-index:200;
    background:rgba(10,14,24,.92);
    align-items:center;justify-content:center;padding:40px;
    cursor:zoom-out;
  }
  .lightbox.open{display:flex;}
  .lightbox img{max-width:92vw;max-height:88vh;object-fit:contain;border-radius:8px;box-shadow:0 20px 50px rgba(0,0,0,.5);}
  .lightbox .close-btn{
    position:absolute;top:22px;right:28px;
    width:40px;height:40px;border-radius:50%;
    background:rgba(255,255,255,.12);color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:20px;cursor:pointer;border:1px solid rgba(255,255,255,.25);
  }

  /* ---------- EXPERIENCE NOTE ---------- */
  .exp-note h2{color:var(--blue);font-size:20px;margin-bottom:18px;}
  .exp-badge{
    border-radius:8px;padding:10px 14px;margin-bottom:10px;color:#fff;
  }
  .exp-badge .role{font-size:13px;font-weight:700;}
  .exp-badge .period{font-size:10.5px;opacity:.85;margin-top:2px;}
  .skills-icons{display:flex;gap:22px;flex-wrap:wrap;margin-top:26px;}
  .skills-icons .skill{display:flex;flex-direction:column;align-items:center;gap:8px;}
  .skills-icons .skill-badge{
    width:52px;height:52px;border-radius:12px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-weight:700;font-size:13px;
    box-shadow:0 6px 14px rgba(0,0,0,.2);
  }
  .skills-icons .skill-badge img{width:100%;height:100%;object-fit:cover;}
  .skills-icons .skill-name{font-size:10.5px;color:var(--ink-muted);font-weight:600;}

  footer{text-align:center;color:rgba(255,255,255,.7);font-size:11px;margin-top:30px;}

  @media(max-width:800px){
    .project-collage{grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;}
    .project-collage .thumb{width:100%;}

    .row, .row.bottom-row{grid-template-columns:1fr;}
    .board{padding:34px 20px;}
    .clip-pin{left:auto;right:14px;top:-20px;animation:swingPinCorner 4.5s ease-in-out infinite;}
    .clip-pin::after{left:auto;right:15px;transform:none;}
  }


  .sticker-deco{position:absolute;pointer-events:none;z-index:6;filter:drop-shadow(0 8px 14px rgba(0,0,0,.3));}
  .sticker-tl{top:-18px;left:-18px;}
  .sticker-tr{top:-18px;right:-18px;}
  .sticker-bl{bottom:-18px;left:12px;}
  .sticker-br{bottom:-18px;right:-18px;}

  .sticker-boo{width:105px;animation:floatY 3.4s ease-in-out infinite;}
  .sticker-sleepy{width:98px;animation:wobble 4.2s ease-in-out infinite;}
  .sticker-blush{width:85px;bottom:-12px;left:-32px;animation:floatY 3.8s ease-in-out infinite reverse;}
  .sticker-heart{width:96px;animation:stickerPulse 2.6s ease-in-out infinite;}
  .sticker-headset{width:85px;animation:wobble 4.6s ease-in-out infinite;}
  .sticker-icecream{width:82px;animation:floatY 3.2s ease-in-out infinite;}
  .sticker-blanket{width:95px;animation:floatY 3.6s ease-in-out infinite reverse;}
  @media(max-width:800px){
    .sticker-boo{width:78px;}
    .sticker-sleepy{width:80px;}
    .sticker-blush{width:56px;bottom:-8px;left:-20px;}
    .sticker-heart{width:80px;}
    .sticker-headset{width:62px;}
    .sticker-icecream{width:55px;}
    .sticker-blanket{width:62px;}
    .sticker-tl{top:-12px;left:-12px;}
    .sticker-tr{top:-12px;right:-12px;}
    .sticker-bl{bottom:-12px;left:8px;}
    .sticker-br{bottom:-12px;right:-12px;}
  }
</style>
</head>

const FALLBACK = {
  name: "Hafidh Sabryan Alfatih",
  title: "Content Creator",
  photoUrl: "https://placehold.co/600x800/e9e4d6/8a5a34?text=Photo",
  about: "Hi, I'm Hafidh Sabryan Alfatih. This bio, photo, skills, and projects below are pulled live from the admin panel — update them there and they'll show up here automatically.",
  skills: [

  experience: [
    {period:"Ongoing", title:"Add your role", sub:"Add a short description"}
  ],
  contact: { whatsapp:"085349391484", instagram:"lrofers", tiktok:"lrofers" },
  projects: [
    {title:"Project 1", imageUrl:"https://placehold.co/300x225/f2c14e/8a5a34?text=Project"},
    {title:"Project 2", imageUrl:"https://placehold.co/300x225/ffffff/8a5a34?text=Project"}
  ]
};

const badgeColors = ['var(--green)','var(--purple)','var(--orange)','var(--pink)','var(--blue)'];

function render(data){
  document.getElementById('id-photo').src = data.photoUrl;
  document.getElementById('id-handle').textContent = (data.contact && data.contact.instagram) ? '@'+data.contact.instagram : data.title;
  document.getElementById('name-heading').textContent = data.name;
  document.getElementById('about-text').textContent = data.about;
  document.getElementById('hero-name-tag').textContent = data.name;
  document.getElementById('hero-title').textContent = data.title;

  const ICONS = {
    whatsapp: '<svg viewBox="0 0 24 24" fill="#fff" width="60%" height="60%"><path d="M12.02 2C6.5 2 2.02 6.48 2.02 12c0 1.77.46 3.45 1.27 4.9L2 22l5.25-1.38A9.94 9.94 0 0 0 12.02 22C17.55 22 22 17.52 22 12S17.55 2 12.02 2zm0 18.1c-1.6 0-3.13-.43-4.46-1.24l-.32-.19-3.12.82.83-3.04-.2-.31A8.07 8.07 0 0 1 3.9 12c0-4.48 3.65-8.12 8.12-8.12S20.14 7.52 20.14 12s-3.65 8.1-8.12 8.1zm4.48-6.06c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.78.95-.14.16-.28.18-.52.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.43-1.34-1.67-.14-.24-.01-.37.11-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.8-.2-.48-.4-.42-.55-.42-.14 0-.3-.02-.46-.02-.16 0-.42.06-.64.3-.22.24-.85.83-.85 2.02 0 1.19.87 2.34.99 2.5.12.16 1.71 2.61 4.14 3.66.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>',
    instagram: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" width="58%" height="58%"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r="1.1" fill="#fff" stroke="none"/></svg>',
    tiktok: '<svg viewBox="0 0 24 24" fill="#fff" width="52%" height="52%"><path d="M16.5 2h-3.1v13.7c0 1.5-1.2 2.7-2.7 2.7-1.5 0-2.7-1.2-2.7-2.7 0-1.5 1.2-2.7 2.7-2.7.3 0 .5 0 .8.1V9.9c-.3 0-.5-.1-.8-.1-3.2 0-5.8 2.6-5.8 5.8s2.6 5.8 5.8 5.8 5.8-2.6 5.8-5.8V8.4c1.2.9 2.7 1.4 4.3 1.4V6.6c-2.4 0-4.3-1.9-4.3-4.3V2z"/></svg>'
  };

  const contact = data.contact || {};
  const contactList = document.getElementById('contact-list');
  contactList.innerHTML = '';
  if(contact.whatsapp){
    const digits = contact.whatsapp.replace(/[^0-9]/g,'').replace(/^0/,'62');
    contactList.innerHTML += `<div class="contact-row"><span class="ic" style="background:var(--green)">${ICONS.whatsapp}</span><a href="https://wa.me/${digits}" target="_blank" rel="noopener">${contact.whatsapp}</a></div>`;
  }
  if(contact.instagram){
    contactList.innerHTML += `<div class="contact-row"><span class="ic" style="background:linear-gradient(135deg,#f9ce34,#ee2a7b,#6228d7)">${ICONS.instagram}</span><a href="https://instagram.com/${contact.instagram}" target="_blank" rel="noopener">@${contact.instagram}</a></div>`;
  }
  if(contact.tiktok){
    contactList.innerHTML += `<div class="contact-row"><span class="ic" style="background:#000">${ICONS.tiktok}</span><a href="https://tiktok.com/@${contact.tiktok}" target="_blank" rel="noopener">@${contact.tiktok}</a></div>`;
  }

  const collage = document.getElementById('project-collage');
  collage.innerHTML = '';
  (data.projects||[]).forEach((p,i)=>{
    const el = document.createElement('div');
    el.className = 'thumb' + (i===0 ? ' gold' : '');
    const ratio = p.ratio || 'auto';
    const ratioAttr = ratio !== 'auto' ? `data-ratio="${ratio}"` : '';
    el.innerHTML = `<img src="${p.imageUrl}" alt="${p.title}" ${ratioAttr}><div class="cap">${p.title}</div>`;
    collage.appendChild(el);
  });
  collage.querySelectorAll('img').forEach(img=>{
    img.addEventListener('click', ()=>openLightbox(img.src));
  });

  const expWrap = document.getElementById('experience-badges');
  expWrap.innerHTML = '';
  (data.experience||[]).forEach((e,i)=>{
    const color = badgeColors[i % badgeColors.length];
    expWrap.innerHTML += `<div class="exp-badge" style="background:${color}"><div class="role">${e.title}</div><div class="period">${e.period}</div></div>`;
  });

  const skillsWrap = document.getElementById('skills-icons');
  skillsWrap.innerHTML = '';
  (data.skills||[]).forEach(s=>{
    const iconHtml = s.iconUrl
      ? `<img src="${s.iconUrl}" alt="${s.name||s.label}">`
      : (s.label||'?');
    skillsWrap.innerHTML += `
      <div class="skill">
        <div class="skill-badge" style="background:${s.color||'#333'}">${iconHtml}</div>
        <div class="skill-name">${s.name||s.label}</div>
      </div>`;
  });
}

async function loadData(){
  try{
    const res = await fetch(`${API_BASE}/api/portfolio`, {cache:"no-store"});
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    render(data);
  }catch(err){
    console.warn('Falling back to placeholder content — backend not reachable yet:', err);
    render(FALLBACK);
  }
}
loadData();

/* lightbox for project photos */
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');
function openLightbox(src){
  lightboxImg.src = src;
  lightbox.classList.add('open');
}
function closeLightbox(){
  lightbox.classList.remove('open');
  lightboxImg.src = '';
}
lightbox.addEventListener('click', closeLightbox);
document.getElementById('lightbox-close').addEventListener('click', (e)=>{
  e.stopPropagation();
  closeLightbox();
});
document.addEventListener('keydown', (e)=>{
  if(e.key === 'Escape') closeLightbox();
});

/* animate hero title letter-by-letter */
(function(){
  const titleEl = document.getElementById('hero-big-title');
  const word = 'Portofolio';
  titleEl.innerHTML = '';
  word.split('').forEach((ch, idx)=>{
    const span = document.createElement('span');
    span.className = 'letter';
    span.textContent = ch;
    span.style.animationDelay = (idx * 0.06) + 's';
    titleEl.appendChild(span);
  });
})();

/* reveal-on-view text animation for hero */
const revealEls = document.querySelectorAll('.reveal, .reveal-left, .reveal-right');
const revealObserver = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      entry.target.classList.add('reveal-visible');
      revealObserver.unobserve(entry.target);
    }
  });
},{threshold:0.2});
revealEls.forEach(el=>revealObserver.observe(el));

/* nav buttons: press effect + smooth sliding scroll to target section */
function smoothScrollTo(target, duration){
  const startY = window.pageYOffset;
  const targetY = target.getBoundingClientRect().top + startY - 16;
  const diff = targetY - startY;
  let startTime = null;
  function easeInOutCubic(t){
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
  }
  function step(timestamp){
    if(!startTime) startTime = timestamp;
    const elapsed = timestamp - startTime;
    const progress = Math.min(elapsed / duration, 1);
    window.scrollTo(0, startY + diff * easeInOutCubic(progress));
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

document.querySelectorAll('.paper-nav a').forEach(link=>{
  link.addEventListener('click', function(e){
    e.preventDefault();
    const target = document.querySelector(this.getAttribute('href'));
    this.classList.add('pressed');
    setTimeout(()=>this.classList.remove('pressed'), 180);
    if(target) smoothScrollTo(target, 750);
  });
});
</script>
