<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hafidh Sabryan Alfatih — Portfolio 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-deep:#05070c;
    --panel-navy:#0b1626;
    --panel-navy-2:#123152;
    --panel-navy-3:#1a4270;
    --accent-red-1:#c23b3b;
    --accent-red-2:#6e1420;
    --cyan-glow:#4fb3e8;
    --text-primary:#eef3f8;
    --text-muted:#8ea3b8;
    --text-dim:#5c7086;
    --line:rgba(255,255,255,0.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--bg-deep);
    color:var(--text-primary);
    font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-red-1);color:#fff;}

  .display{font-family:'Anton',sans-serif;font-weight:400;letter-spacing:.5px;}
  .hud{font-family:'Rajdhani',sans-serif;font-weight:700;letter-spacing:2.5px;text-transform:uppercase;}

  /* ---------- NAV ---------- */
  .navwrap{
    position:fixed;top:0;left:0;right:0;z-index:100;
    display:flex;justify-content:center;padding-top:22px;
    pointer-events:none;
  }
  .navpill{
    pointer-events:auto;
    display:flex;gap:6px;
    background:rgba(10,18,30,0.72);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:999px;
    padding:6px;
  }
  .navpill a{
    display:block;
    padding:9px 20px;
    border-radius:999px;
    color:var(--text-muted);
    text-decoration:none;
    font-size:12px;
  }
  .navpill a.active{
    background:linear-gradient(135deg,var(--cyan-glow),#2a6fa8);
    color:#04121e;
  }
  .brand{
    position:fixed;top:24px;left:32px;z-index:100;
    width:38px;height:38px;
    border:1px solid var(--line);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Anton',sans-serif;
    background:rgba(10,18,30,0.72);
    backdrop-filter:blur(10px);
  }

  section{
    min-height:100vh;
    position:relative;
    padding:100px 8vw 60px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    border-bottom:1px solid var(--line);
    overflow:hidden;
  }

  /* ---------- HERO ---------- */
  #hero{
    background:
      radial-gradient(ellipse 900px 500px at 15% 55%, rgba(26,66,112,0.55), transparent 60%),
      linear-gradient(180deg,#070c14 0%, #0a1626 100%);
  }
  .hero-inner{
    display:flex;align-items:center;gap:40px;flex-wrap:wrap;
  }
  .hero-photo{
    position:relative;
    width:200px;height:240px;flex-shrink:0;
    display:flex;align-items:center;
  }
  .hero-photo .redblob{
    position:absolute;
    left:-90px;top:50%;transform:translateY(-50%);
    width:260px;height:260px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%, var(--accent-red-1), var(--accent-red-2) 70%);
    z-index:1;
  }
  .hero-photo img{
    position:relative;z-index:2;
    width:190px;height:240px;
    object-fit:cover;
    border-radius:4px;
    display:block;
    margin-left:20px;
  }
  .hero-text .eyebrow{
    color:var(--cyan-glow);
    font-size:13px;
    margin-bottom:10px;
  }
  .hero-text h1{
    font-size:clamp(48px,8vw,96px);
    line-height:0.95;
    background:linear-gradient(180deg,#fdfefe 10%,#9aacc0 55%,#f3f6f9 95%);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }
  .hero-year{
    display:inline-block;margin-top:6px;
    font-family:'Rajdhani',sans-serif;font-weight:600;
    font-size:22px;color:var(--text-muted);letter-spacing:4px;
  }
  .hero-role{
    margin-top:22px;
    display:inline-flex;align-items:center;gap:10px;
    font-size:13px;color:var(--text-muted);
  }
  .hero-role span.chk{
    width:12px;height:12px;border:1px solid var(--text-muted);display:inline-block;
  }
  .hero-menu{
    margin-top:34px;display:flex;flex-direction:column;gap:14px;
  }
  .hero-menu a{
    color:var(--text-muted);text-decoration:none;font-size:13px;
    letter-spacing:3px;transition:color .2s, padding-left .2s;
  }
  .hero-menu a:hover{color:#fff;padding-left:8px;}

  /* ---------- PROFILE ---------- */
  #profile{
    background:linear-gradient(180deg,#0a1524 0%, #0d1c30 100%);
  }
  .profile-grid{
    display:grid;
    grid-template-columns:280px 1fr;
    gap:64px;
    align-items:start;
  }
  .profile-photo-wrap{position:relative;}
  .profile-photo-wrap::before{
    content:"";position:absolute;inset:-14px;
    border:1px solid var(--line);border-radius:12px;
    background:linear-gradient(160deg,rgba(79,179,232,.08),transparent 60%);
  }
  .profile-photo-wrap img{
    position:relative;width:100%;aspect-ratio:3/4;object-fit:cover;
    border-radius:8px;filter:saturate(1.05) contrast(1.05);
  }
  .kicker{color:var(--cyan-glow);font-size:12px;margin-bottom:6px;}
  .profile-name{font-size:22px;font-weight:600;margin-bottom:26px;}
  h2.section-title{
    font-size:clamp(30px,4vw,44px);
    margin-bottom:18px;
  }
  .about-text{
    color:var(--text-muted);
    line-height:1.7;
    max-width:60ch;
    margin-bottom:34px;
    font-size:15px;
  }
  .block-label{
    color:var(--text-primary);
    font-size:14px;font-weight:700;
    margin-bottom:14px;
    letter-spacing:1px;
  }
  .skills-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:36px;}
  .skill-badge{
    width:46px;height:46px;border-radius:11px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:14px;
    color:#fff;
    box-shadow:0 4px 14px rgba(0,0,0,.35);
  }
  .two-col{display:grid;grid-template-columns:1fr 1fr;gap:40px;}
  .info-item{margin-bottom:14px;}
  .info-item .period{color:var(--cyan-glow);font-size:11px;letter-spacing:1px;}
  .info-item .title{font-size:14px;font-weight:600;margin-top:2px;}
  .info-item .sub{color:var(--text-muted);font-size:13px;margin-top:2px;}
  .lang-row{display:flex;justify-content:space-between;font-size:13px;color:var(--text-muted);margin-bottom:10px;max-width:340px;}
  .lang-row b{color:var(--text-primary);font-weight:600;}

  /* ---------- PROJECTS ---------- */
  #projects{
    background:radial-gradient(ellipse 1000px 500px at 80% 20%, rgba(26,66,112,.35), transparent 60%), #05080f;
  }
  .proj-head{display:flex;align-items:baseline;gap:14px;margin-bottom:34px;}
  .proj-head span.tag{
    font-family:'Rajdhani',sans-serif;font-weight:700;font-size:11px;
    border:1px solid var(--line);padding:4px 10px;border-radius:5px;color:var(--text-muted);
  }
  .proj-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    grid-auto-rows:150px;
    gap:10px;
  }
  .proj-item{
    position:relative;border-radius:8px;overflow:hidden;
    background:#111c2c;border:1px solid var(--line);
  }
  .proj-item img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s;}
  .proj-item:hover img{transform:scale(1.06);}
  .proj-item .label{
    position:absolute;bottom:0;left:0;right:0;
    padding:8px 10px;font-size:11px;color:var(--text-muted);
    background:linear-gradient(0deg,rgba(0,0,0,.75),transparent);
  }
  .proj-item.big{grid-column:span 2;grid-row:span 2;}

  /* ---------- CONTACT ---------- */
  #contact{
    background:linear-gradient(180deg,#0a1524 0%,#050810 100%);
    border-bottom:none;
  }
  .contact-grid{
    display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center;
  }
  .contact-card{display:flex;gap:20px;align-items:center;}
  .contact-card img{
    width:120px;height:120px;border-radius:50%;object-fit:cover;
    border:2px solid var(--line);
  }
  .contact-links a{
    display:flex;align-items:center;gap:8px;
    color:var(--text-muted);text-decoration:none;font-size:13px;margin-bottom:8px;
  }
  .contact-links a:hover{color:#fff;}
  .contact-links .plat{
    width:20px;height:20px;border-radius:5px;background:var(--panel-navy-3);
    display:inline-flex;align-items:center;justify-content:center;font-size:10px;
  }
  .thankyou h2{
    font-size:clamp(40px,7vw,80px);
    text-align:right;
    background:linear-gradient(180deg,#fdfefe 10%,#9aacc0 55%,#f3f6f9 95%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    line-height:.95;
  }
  footer{
    text-align:center;padding:22px;color:var(--text-dim);font-size:11px;
    background:#050810;
  }

  @media(max-width:860px){
    .profile-grid{grid-template-columns:1fr;}
    .two-col{grid-template-columns:1fr;}
    .contact-grid{grid-template-columns:1fr;}
    .proj-grid{grid-template-columns:repeat(2,1fr);}
    .proj-item.big{grid-column:span 2;}
    .thankyou h2{text-align:left;}
    .navpill a{padding:8px 12px;font-size:10px;}
  }
</style>
</head>
<body>

<div class="brand">HA</div>
<div class="navwrap">
  <nav class="navpill hud" id="navpill">
    <a href="#profile" class="active">Profil</a>
    <a href="#projects">Project</a>
    <a href="#contact">Contact Person</a>
  </nav>
</div>

<!-- HERO -->
<section id="hero">
  <div class="hero-inner">
    <div class="hero-photo">
      <div class="redblob"></div>
      <img id="hero-photo" src="" alt="Hafidh Sabryan Alfatih">
    </div>
    <div class="hero-text">
      <h1 class="display">Portfolio<span class="hero-year"> 2025</span></h1>
      <div class="hero-role hud"><span class="chk"></span> <span id="hero-title">Content Creator</span></div>
      <div class="hero-menu hud">
        <a href="#profile">Start</a>
        <a href="#projects">Options</a>
        <a href="#contact">Exit</a>
      </div>
    </div>
  </div>
</section>

<!-- PROFILE -->
<section id="profile">
  <div class="profile-grid">
    <div class="profile-photo-wrap">
      <img id="profile-photo" src="" alt="Hafidh Sabryan Alfatih">
    </div>
    <div>
      <div class="kicker hud">Hello, I am</div>
      <div class="profile-name display" style="font-size:26px;" id="profile-name">Hafidh Sabryan Alfatih</div>

      <h2 class="section-title display">About Me</h2>
      <p class="about-text" id="about-text">Loading…</p>

      <div class="block-label hud">Software Skills</div>
      <div class="skills-row" id="skills-row"></div>

      <div class="two-col">
        <div>
          <div class="block-label hud">Education</div>
          <div id="education-list"></div>
        </div>
        <div>
          <div class="block-label hud">Experience</div>
          <div id="experience-list"></div>
        </div>
      </div>

      <div style="margin-top:30px;">
        <div class="block-label hud">Language</div>
        <div id="languages-list"></div>
      </div>
    </div>
  </div>
</section>

<!-- PROJECTS -->
<section id="projects">
  <div class="proj-head">
    <h2 class="section-title display" style="margin-bottom:0;">Recap Project 2025</h2>
    <span class="tag hud">No AI</span>
  </div>
  <div class="proj-grid" id="proj-grid"></div>
</section>

<!-- CONTACT -->
<section id="contact">
  <div class="contact-grid">
    <div>
      <div class="block-label hud" style="margin-bottom:20px;">Contact Me</div>
      <div class="contact-card">
        <img id="contact-photo" src="" alt="Hafidh Sabryan Alfatih">
        <div>
          <div style="font-weight:600;margin-bottom:2px;" id="contact-name">Hafidh Sabryan Alfatih</div>
          <div class="contact-links" id="contact-links" style="margin-top:10px;"></div>
        </div>
      </div>
    </div>
    <div class="thankyou">
      <h2 class="display">Thank You<br>2025</h2>
    </div>
  </div>
</section>

<footer>© 2025 Hafidh Sabryan Alfatih</footer>

<script>
/* ============================================================
   CONFIG
   Point this at your own backend (see API_CONTRACT.md).
   The backend is the only thing that talks to JSONBin —
   no API keys live in this file.
   ============================================================ */
const API_BASE = window.PORTFOLIO_API_BASE || "https://hafidsa-production.up.railway.app";

const FALLBACK = {
  name: "Hafidh Sabryan Alfatih",
  title: "Content Creator",
  photoUrl: "https://placehold.co/600x800/0d1c30/9aacc0?text=Photo",
  about: "Hi, I'm Hafidh Sabryan Alfatih. This bio, the photo, the skills, and the timeline below are all pulled live from the admin panel — update them there and they'll show up here automatically.",
  skills: [
    {label:"Ps", name:"Photoshop", color:"#001e36"},
    {label:"Ai", name:"Illustrator", color:"#330000"},
    {label:"Pr", name:"Premiere Pro", color:"#00005b"},
    {label:"Lr", name:"Lightroom", color:"#001e36"},
    {label:"Cc", name:"CapCut", color:"#0a0a0a"}
  ],
  education: [
    {period:"2019 – 2022", title:"Add your school", sub:"Add your major / focus"}
  ],
  experience: [
    {period:"Ongoing", title:"Add your role", sub:"Add a short description"}
  ],
  languages: [
    {name:"Indonesia", level:95},
    {name:"English", level:60}
  ],
  contact: {
    instagram:"", tiktok:"", youtube:"", pinterest:""
  },
  projects: [
    {title:"Project 1", imageUrl:"https://placehold.co/400x300/111c2c/5c7086?text=Project", big:true},
    {title:"Project 2", imageUrl:"https://placehold.co/300x150/111c2c/5c7086?text=Project"},
    {title:"Project 3", imageUrl:"https://placehold.co/300x150/111c2c/5c7086?text=Project"},
    {title:"Project 4", imageUrl:"https://placehold.co/300x150/111c2c/5c7086?text=Project"},
    {title:"Project 5", imageUrl:"https://placehold.co/300x150/111c2c/5c7086?text=Project"}
  ]
};

function render(data){
  document.getElementById('hero-photo').src = data.photoUrl;
  document.getElementById('profile-photo').src = data.photoUrl;
  document.getElementById('contact-photo').src = data.photoUrl;
  document.getElementById('hero-title').textContent = data.title;
  document.getElementById('profile-name').textContent = data.name;
  document.getElementById('contact-name').textContent = data.name;
  document.getElementById('about-text').textContent = data.about;

  const skillsRow = document.getElementById('skills-row');
  skillsRow.innerHTML = '';
  (data.skills||[]).forEach(s=>{
    const el = document.createElement('div');
    el.className='skill-badge';
    el.title = s.name || s.label;
    if(s.iconUrl){
      el.style.background = 'transparent';
      el.style.padding = '0';
      el.style.overflow = 'hidden';
      el.innerHTML = `<img src="${s.iconUrl}" alt="${s.name||s.label}" style="width:100%;height:100%;object-fit:cover;border-radius:11px;">`;
    }else{
      el.style.background = s.color || '#16324f';
      el.textContent = s.label;
    }
    skillsRow.appendChild(el);
  });

  const edu = document.getElementById('education-list');
  edu.innerHTML='';
  (data.education||[]).forEach(e=>{
    edu.innerHTML += `<div class="info-item"><div class="period">${e.period}</div><div class="title">${e.title}</div><div class="sub">${e.sub||''}</div></div>`;
  });

  const exp = document.getElementById('experience-list');
  exp.innerHTML='';
  (data.experience||[]).forEach(e=>{
    exp.innerHTML += `<div class="info-item"><div class="period">${e.period}</div><div class="title">${e.title}</div><div class="sub">${e.sub||''}</div></div>`;
  });

  const langs = document.getElementById('languages-list');
  langs.innerHTML='';
  (data.languages||[]).forEach(l=>{
    langs.innerHTML += `<div class="lang-row"><span>${l.name}</span><b>${l.level}%</b></div>`;
  });

  const links = document.getElementById('contact-links');
  links.innerHTML='';
  const platforms = [
    {key:'instagram', label:'IG', name:'Instagram'},
    {key:'tiktok', label:'TT', name:'TikTok'},
    {key:'youtube', label:'YT', name:'YouTube'},
    {key:'pinterest', label:'PT', name:'Pinterest'}
  ];
  platforms.forEach(p=>{
    const val = data.contact && data.contact[p.key];
    if(!val) return;
    const href = val.startsWith('http') ? val : `https://${p.key}.com/${val.replace('@','')}`;
    links.innerHTML += `<a href="${href}" target="_blank" rel="noopener"><span class="plat">${p.label}</span> ${val}</a>`;
  });

  const grid = document.getElementById('proj-grid');
  grid.innerHTML='';
  (data.projects||[]).forEach((p,i)=>{
    const el = document.createElement('div');
    el.className = 'proj-item' + (p.big ? ' big' : '');
    el.innerHTML = `<img src="${p.imageUrl}" alt="${p.title}"><div class="label">${p.title}</div>`;
    grid.appendChild(el);
  });
}

async function loadData(){
  try{
    const res = await fetch(`${API_BASE}/api/portfolio`, {cache:"no-store"});
    if(!res.ok) throw new Error('bad response');
    const data = await res.json();
    render(data);
  }catch(err){
    console.warn('Falling back to placeholder content — backend not reachable yet:', err);
    render(FALLBACK);
  }
}
loadData();

/* scroll-spy nav */
const links = document.querySelectorAll('#navpill a');
const sections = ['profile','projects','contact'].map(id=>document.getElementById(id));
const spy = new IntersectionObserver((entries)=>{
  entries.forEach(entry=>{
    if(entry.isIntersecting){
      links.forEach(l=>l.classList.remove('active'));
      const match = document.querySelector(`#navpill a[href="#${entry.target.id}"]`);
      if(match) match.classList.add('active');
    }
  });
},{threshold:0.5});
sections.forEach(s=>spy.observe(s));
</script>
</body>
</html>
